<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="javascript:(()=>{const id='mlk',old=document.getElementById(id);if(old){old.remove();document.querySelectorAll('[data-mlk]').forEach(a=>{a.style.outline='';delete a.dataset.mlk});return}const w=document.createElement('div');w.id=id;document.body.appendChild(w);document.querySelectorAll('a[href]').forEach(a=>{a.dataset.mlk=1;a.style.outline='2px solid magenta';const r=a.getBoundingClientRect();if(!r.width&&!r.height)return;const t=document.createElement('div');t.textContent=(a.title||a.textContent.trim().replace(/\s+/g,' ').slice(0,60)||'(no title)')+' → '+a.href;Object.assign(t.style,{position:'absolute',left:(r.left+scrollX)+'px',top:(r.bottom+scrollY)+'px',background:'magenta',color:'#fff',font:'11px/1.3 monospace',padding:'2px 4px',zIndex:2147483647,maxWidth:'60ch',wordBreak:'break-all',pointerEvents:'none'});w.appendChild(t)})})();">Highlight links (deterministically)</a>
</body>
</html>
